<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Point Studio Architecture + Design offers full architectural services for residential and commercial spaces in the San Francisco Bay Area: remodels, new homes and ADUs." />

       to a custom domain. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Point Studio Architecture + Design" />
  <meta property="og:title" content="Point Studio Architecture + Design — Bay Area Architecture" />
  <meta property="og:description" content="Point Studio Architecture + Design offers full architectural services for residential and commercial spaces in the San Francisco Bay Area: remodels, new homes and ADUs." />

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

<body data-page="projects">
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="gallery-wrap">
      <div class="gallery" id="galleryTrack">
        <!-- project cards + closing card injected by js/main.js -->
      </div>

      <!-- Thin progress line: fills as you scroll through the projects -->
      <div class="scroll-progress" id="scrollProgress" role="progressbar"
           aria-label="Gallery scroll position" aria-valuemin="0" aria-valuemax="100">
        <div class="scroll-progress-fill" id="scrollProgressFill"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/projects-data.js"></script>
