<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Point Studio Architecture</title>
  <meta name="description" content="Get in touch about a residential architecture or renovation project." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="contact">
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="contact-page">
      <h1 class="fade-down" style="animation-delay: 0.1s">Start a project</h1>
      <!-- Custom form. Submissions go to the studio's Google Form behind the
           scenes (see initContactForm in main.js), so responses still land
           in the same Google Form / Sheet as before. -->
      <form class="contact-form fade-down" id="contactForm" style="animation-delay: 0.3s" novalidate>
        <div class="field">
          <label for="cf-name">Full name / company</label>
          <input id="cf-name" name="entry.1769505144" type="text" autocomplete="name" required />
          <p class="field-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="cf-email">Email</label>
          <input id="cf-email" name="entry.658655044" type="email" autocomplete="email" required />
          <p class="field-error" aria-live="polite"></p>
        </div>

        <fieldset class="field">
          <legend>Inquiry type</legend>
          <div class="choice-group">
            <label class="choice"><input type="radio" name="entry.2042927560" value="Project Inquiry" required /><span>Project Inquiry</span></label>
            <label class="choice"><input type="radio" name="entry.2042927560" value="Partnership Opportunity" /><span>Partnership Opportunity</span></label>
            <label class="choice"><input type="radio" name="entry.2042927560" value="Press Inquiry" /><span>Press Inquiry</span></label>
            <label class="choice"><input type="radio" name="entry.2042927560" value="General Question" /><span>General Question</span></label>
          </div>
          <p class="field-error" aria-live="polite"></p>
        </fieldset>

        <div class="field">
          <label for="cf-message">Describe your project or inquiry <span class="optional">(optional)</span></label>
          <textarea id="cf-message" name="entry.1696812339" rows="2"></textarea>
        </div>

        <!-- Spam trap: hidden from people, bots tend to fill it in -->
        <div class="hp" aria-hidden="true">
          <label for="cf-website">Website</label>
          <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <div class="form-actions">
          <button type="submit" class="form-submit">Send</button>
          <p class="form-status" aria-live="polite"></p>
        </div>
      </form>

      <div class="form-thanks" id="formThanks" hidden>
        <h2>Thank you</h2>
        <p>We've received your submission and will be in touch soon.</p>
      </div>

      <p class="direct-contact fade-down" style="animation-delay: 0.5s">
        Or reach out directly at <a href="mailto:hello@pointstudioarch.com">hello@pointstudioarch.com</a>
      </p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
