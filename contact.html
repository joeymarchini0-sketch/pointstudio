<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Get in touch about a residential architecture or renovation project." />
  <link rel="stylesheet" href="css/style.css" />

<body data-page="contact">
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="contact-page">
      <div class="eyebrow">Contact</div>
      <h1>Start a conversation</h1>

        Tell us a bit about your project and we'll be in touch. Fields below

      </p>

      <div class="form-frame">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSfnqbIs-iXV7LYIfH5TtgBRSmHQe3mwCvhHGSS9X09CmNLXXw/viewform?embedded=true"
          title="Point Studio Architecture contact form"
          loading="lazy"
        >Loading…</iframe>
      </div>

      <p class="direct-contact">
        Or reach out directly at <a href="mailto:hello@example.com">hello@example.com</a>
      </p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>

</html>
