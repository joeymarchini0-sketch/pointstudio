<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Studio Name</title>
  <meta name="description" content="Get in touch about a residential architecture or renovation project." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contact">
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="contact-page">
      <div class="eyebrow">Contact</div>
      <h1>Start a conversation</h1>
      <p class="lead">
        Tell us a bit about your project and we'll be in touch. Fields below
        will be replaced by the real intake form.
      </p>

      <div class="form-frame">
        <!--
          STEP TO DO: once you have the Google Form embed link, replace the
          block below with:

          <iframe src="YOUR_GOOGLE_FORM_EMBED_URL" title="Contact form">
            Loading…
          </iframe>

          Google gives you this URL from Form > Send > Embed (< >) icon —
          copy just the src="..." value.
        -->
        <div class="form-placeholder">
          Google Form will be embedded here.<br />
          Replace the placeholder in <code>contact.html</code> with the
          form's <code>&lt;iframe&gt;</code> embed code.
        </div>
      </div>

      <p class="direct-contact">
        Or reach out directly at <a href="mailto:hello@example.com">hello@example.com</a>
      </p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
